name: chat-critters
services:
  nib:
    image: chat-critters:local
    build:
      context: .
      target: runtime
    init: true
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_NETWORK_MODE: container
      PORT: "3000"
    ports:
      - "127.0.0.1:${NIB_HTTP_PORT:-3000}:3000"
    volumes:
      - nib-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  nib-data:
